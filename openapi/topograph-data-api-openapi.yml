    CreateCompanyRequestDTO:
      type: object
      properties:
        id:
          type: string
          example: '932884117'
          description: 'The company id. In some countries, this might be a concatenation of the registry and city (e.g., in Germany: "Augsburg HRB 34617"). The search function will always return a usable company number. Check the documentation to see which number format is used for each country. Optional when `graphContinueFromNodeIds` is set — the server derives it from the parent request.'
        countryCode:
          type: string
          enum:
          - AT
          - BE
          - BG
          - CH
          - CN
          - CZ
          - CY
          - DE
          - DK
          - EE
          - ES
          - FI
          - FR
          - GB
          - GG
          - GR
          - HK
          - HR
          - HU
          - IE
          - IS
          - IT
          - JE
          - LI
          - LU
          - LV
          - MC
          - MT
          - MU
          - NL
          - 'NO'
          - PL
          - PT
          - RO
          - RU
          - SE
          - SG
          - SI
          - SK
          - VG
          example: FR
          description: The country code in ISO 3166-1 alpha-2 format (e.g., "FR" for France, "DE" for Germany). Optional when `graphContinueFromNodeIds` is set — the server derives it from the parent request.
        dataPoints:
          type: array
          items:
            type: string
            enum:
            - companyProfile
            - ultimateBeneficialOwners
            - availableDocuments
            - shareholders
            - graph
            - company
            - legalRepresentatives
            - otherKeyPersons
            - establishments
            - subsidiaries
          example:
          - company
          - legalRepresentatives
          description: 'The data points to retrieve: company, legalRepresentatives, otherKeyPersons, establishments, shareholders, subsidiaries, ultimateBeneficialOwners, availableDocuments, graph. Legacy: companyProfile (maps to company + legalRepresentatives for billing).'
        documents:
          type: array
          items:
            type: string
          example:
          - 1c932de4-4610-5506-b48d-4e62529d58e8
          description: List of document IDs to retrieve. Discover these IDs by requesting the "availableDocuments" data point first, then pass the returned IDs here in a follow-up request.
        graphContinueFromNodeIds:
          type: array
          items:
            type: string
          example:
          - FR:12345
          - DE:HRB999
          description: 'Continue a previous graph request from specific leaf nodes. Each nodeId must refer to a `budget_truncated` node in the parent request''s graph (discover them in the parent''s response). When set, the new request is linked to the parent via `mainRequestId`, `countryCode` and `id` are derived from the parent, and BFS seeds from these leaves instead of the root company. Cost deduplication applies across the full request tree, so already-paid companies are not re-billed. If the parent request ran with `graphInteractive: true`, every continuation inherits that flag automatically (any client-supplied value is ignored) so chip-driven exploration stays one level at a time.'
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          description: 'Arbitrary key-value string pairs to associate with the request. Limits: max 50 keys, keys up to 40 chars (longer keys are skipped), values up to 500 chars (longer values are truncated).'
        graphMaxBudget:
          type: number
          example: 1000
          description: Maximum budget in credit cents for graph traversal. When the "graph" datapoint is requested, the traversal will stop once this budget is reached. If not provided, uses a default maximum. Ignored when `graphInteractive` is true.
        graphInteractive:
          type: boolean
          example: false
          description: 'Interactive graph mode. When true, the traversal fetches only the entry node (the root for an initial request, the seeded node for a continuation) and stops; its direct shareholders are returned as graph nodes — companies among them appear as `budget_truncated` chips that you can pass back into a follow-up request via `graphContinueFromNodeIds`. Every continuation under a parent that ran with `graphInteractive: true` is auto-flagged interactive (server-enforced) so chip-driven exploration stays one level at a time. Use this for deliberate, click-by-click exploration with predictable per-step cost. Ignores `graphMaxBudget`.'
        profileMaxBudget:
          type: number
          example: 500
          description: Maximum budget in credit cents for company profile retrieval. For countries with variable pricing (e.g., Hungary), the request will fail with a budget_exceeded error if the actual cost exceeds this budget. The error includes the quoted price so the user can retry with a higher budget.
        mode:
          type: string
          enum:
          - verification
          - onboarding
          description: Data retrieval mode. "verification" (default) selects authoritative live registry sources. "onboarding" selects the cheapest compatible fast source for form prefill and initial screening, and marks unsupported datapoints as failed with error code "fast_source_unavailable" when no fast source exists.
        fast:
          type: boolean
          deprecated: true
          description: 'Deprecated. Use mode: "onboarding" instead.'
        authoritative:
          type: boolean
          deprecated: true
          description: Deprecated. Use mode instead.
        maxBudget:
          type: number
          example: 200
          description: Hard cap on total block cost in credit cents. If the resolved blocks exceed this budget, the request fails with a budget_exceeded error including the actual cost and suggestion.
        agenticEnrichment:
          type: boolean
          example: true
          description: Enable best-effort enrichment of legal representative person details (birth date, nationality, residence address) from official publications. Belgium only. Not all fields are guaranteed — depends on publication availability. Fixed 50 cent cost per request, charged only if enrichment yields results. Introduces `enriching` datapoint status while processing is in progress.
      required:
      - id
      - countryCode
