    GraphNodeFlagsDTO:
      type: object
      properties:
        isRoot:
          type: boolean
          description: True if this is the root/target company being analyzed
        isUbo:
          type: boolean
          description: True if this individual has >25% ownership and qualifies as a UBO (individuals only)
        isUboProxy:
          type: boolean
          description: True if this company is the ultimate controlling entity of the target company (companies only)
        uboCalculationMethod:
          type: array
          description: Methods that qualified this individual as UBO (only when isUbo is true)
          items:
            type: string
            enum:
            - accumulation
            - domination
        status:
          type: string
          description: Status of the node during graph building. `budget_truncated` marks a frontier company that was not fetched because the request ran out of credits; clients can submit a continuation request to expand it.
          enum:
          - pending
          - found
          - not_found
          - error
          - search_resolved
          - placeholder
          - budget_truncated
    DataSourceDocumentDTO:
      type: object
      properties:
        name:
          type: string
          description: Name of the supporting document
          example: Statuts constitutifs
        date:
          type: string
          description: Date of the document
          example: '2020-03-15'
        reason:
          type: string
          description: Brief explanation of why this document is pertinent for the analysis
          example: Most recent confirmation statement showing 100% ownership by KCA Deutag International 3 Limited
      required:
      - name
    ShareholderDTO:
      type: object
      properties:
        entityId:
          type: string
          description: Unique identifier to track the same person or company across different roles (legal representatives, shareholders, UBOs, etc.). Since data is retrieved from multiple registries, the same entity may appear with slightly different names or details. This ID allows you to identify that "John Smith" as a legal representative is the same person as "J. Smith" listed as a shareholder.
          example: person_001
        type:
          type: string
          description: The type of the shareholder (individual or company)
          enum:
          - individual
          - company
          example: individual
        individual:
          description: Details of the individual shareholder
          allOf:
          - $ref: '#/components/schemas/PhysicalPersonBaseDTO'
        company:
          description: Details of the company shareholder
          allOf:
          - $ref: '#/components/schemas/CompanyDTO'
        sharePercentage:
          type: number
          description: The percentage of shares owned by the shareholder
          example: 25.5
        numberOfShares:
          type: number
          description: The absolute number of shares owned by the shareholder
          example: 1000
        nominalCapitalHeld:
          description: Total nominal (stated) capital value held by this shareholder. This is the face value or par value of all shares owned, calculated as numberOfShares × parValuePerShare. For example, if a shareholder owns 1000 shares with a par value of €10 each, nominalCapitalHeld would be €10,000. This value represents the legal capital contribution recorded in company documents, not the market value or actual amount paid.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountDTO'
        paidInAmount:
          description: Total actual amount paid by the shareholder for their shares, including any share premium over the nominal/par value. This represents the real money invested. For example, if shares with €10,000 nominal value were purchased for €15,000, the paidInAmount would be €15,000. In Italy this corresponds to "valore versato", in Germany to "eingezahltes Kapital". This field captures the actual capital contribution to the company.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountDTO'
      required:
      - type
