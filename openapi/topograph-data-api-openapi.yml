            title: IT
          - $ref: '#/components/schemas/FranceIdentifiers'
            title: FR
          allOf:
          - $ref: '#/components/schemas/CountryIdentifiersDTO'
        taxId:
          description: Tax identification number with validation proof. For EU VAT, the value does NOT include the country prefix (e.g., "27443061841" not "FR27443061841").
          allOf:
          - $ref: '#/components/schemas/TaxIdDTO'
        legalName:
          type: string
          example: Topograph
          description: The legal name of the company.
        legalNameInEnglish:
          type: string
          example: Test Display Hong Kong Trading Limited
          description: The English translation or romanization of the legal name, commonly used for international business. Particularly relevant for companies registered with non-Latin alphabet names (e.g., Chinese, Japanese, Korean, etc.).
        commercialNames:
          example:
          - Topograph
          - TopographHQ
          description: An array of commercial names or trading names used by the company.
          type: array
          items:
            type: string
        legacyLegalNames:
          example:
          - Semaphore
          - SemaphoreHQ
          description: An array of legacy legal names used by the company.
          type: array
          items:
            type: string
        legacyCommercialNames:
          example:
          - Semaphore
          - SemaphoreHQ
          description: An array of legacy commercial names used by the company.
          type: array
          items:
            type: string
        companyNameTransliterations:
          example:
          - Naftogaz
          - Naftohaz
          description: Deterministic Latin transliterations of the company’s legal and commercial names, computed at indexing time using per-country transliteration standards. For Ukrainian entities this contains up to three deduped variants (GOST/unidecode, KMU 55, ISO 9). Element [0] aligns with the output of the generic `?transliterate=true` response flag. Useful for cross-script display, search, and AML name screening. Absent or empty for Latin-script companies and for non-Latin countries not yet covered (phased rollout).
          type: array
          items:
            type: string
        status:
          description: The status of the company, including local status and whether it is active.
          allOf:
          - $ref: '#/components/schemas/CompanyStatusDTO'
        complianceFlags:
          description: Country-agnostic compliance signals reported by the register, keyed by kind (e.g. statutory accounts or the annual confirmation filing being overdue). Each kind has its own dedicated schema and is present only when the register reports that obligation as unmet. Absent when the register reports no outstanding obligations, or for countries that do not expose such signals.
          allOf:
          - $ref: '#/components/schemas/ComplianceFlagsDTO'
        registrationDate:
          type: string
          example: '2024-04-22'
          description: The registration date of the company with the trade register or other authorities.
        incorporationDate:
          type: string
          example: '2024-04-15'
          description: The incorporation date when the company was legally incorporated or founded. This may differ from the registration date, as companies are often incorporated before being registered with trade authorities.
        legalForm:
          description: The legal form of the company, including local and standard forms.
          allOf:
          - $ref: '#/components/schemas/LegalFormDTO'
        capital:
          description: The share capital of the company.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountDTO'
        activities:
          type: object
          description: A dictionary of activity classifications
          example:
            NACE:
            - code: '62.01'
              description: Computer programming activities
            ISIC:
            - code: J620
              description: Computer programming, consultancy and related activities
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/CompanyActivityItemDTO'
        activityDescription:
          type: string
          description: A text description of the company activities
          example: Development of software solutions and IT consulting services
        legalAddress:
          description: The address of the company.
          allOf:
          - $ref: '#/components/schemas/AddressDTO'
        phones:
          example:
          - '+33123456789'
          - '+33987654321'
          description: An array of phone numbers for the company in E.164 format (e.g., +33123456789 for France, +1234567890 for USA).
          type: array
          items:
            type: string
        website:
          type: string
          example: https://www.example.com
          description: The official website URL of the company.
        employeeCount:
          description: The employee count information for the company.
          allOf:
          - $ref: '#/components/schemas/EmployeeCountDTO'
      required:
      - countryCode
    ItalyIdentifiers:
      type: object
      properties:
        VAT:
          type: string
          description: 'Partita IVA (P.IVA) - VAT registration number. Format: 11 digits (e.g., "02580590541"). Issued by: Agenzia delle Entrate (Revenue Agency)'
          example: 02580590541
        Codice Fiscale:
          type: string
          description: 'Codice Fiscale - Tax identification code. Format: 16 alphanumeric characters for individuals (e.g., "RSSMRA70A01H501U"), 11 digits for companies (often same as VAT). Issued by: Agenzia delle Entrate (Revenue Agency)'
          example: RSSMRA70A01H501U
        CCIAA:
          type: string
          description: 'CCIAA - Camera di Commercio (Chamber of Commerce) province code. Format: 2-letter province code (e.g., "TO" for Torino, "MI" for Milano). Indicates which Chamber of Commerce the company is registered with.'
          example: TO
        REA Code:
          type: string
          description: 'REA Code - Registro Economico Amministrativo (Economic Administrative Register) number. Format: Numeric (e.g., "1234567"). Unique within each CCIAA province. Combined with CCIAA forms a unique identifier.'
          example: '1234567'
      description: Identifiers for Italian companies (IT)
    UltimateBeneficialOwnerDTO:
      type: object
      properties:
        gender:
          type: string
          description: Gender of the person
          enum:
          - Male
          - Female
          - Other
          - PreferNotToSay
          example: Female
        name:
          description: Full name of the person
          example:
            fullName: John Doe
          allOf:
          - $ref: '#/components/schemas/PersonNameDTO'
        birthDate:
          description: Birth date of the person
          example:
            day: 15
            month: 7
            year: 1980
          allOf:
          - $ref: '#/components/schemas/BirthDateDTO'
        birthAddress:
          description: Birth address of the person
          example:
            country: FR
            city: Paris
            street: 1 Rue de Rivoli
            postalCode: '75001'
          allOf:
          - $ref: '#/components/schemas/AddressDTO'
        nationality:
          type: string
          description: Nationality ISO2 country code of the person
          example: US
        residenceAddress:
          description: Residence address of the person
          allOf:
          - $ref: '#/components/schemas/AddressDTO'
        identifiers:
          type: object
          description: Identifiers for the person, as a flat object keyed by identifier type (e.g., codice fiscale, national ID). Each value is the identifier string.
          additionalProperties:
            type: string
          example:
            codiceFiscale: RSSMRA80A01H501U
        entityId:
          type: string
          description: Unique identifier to track the same person or company across different roles (legal representatives, shareholders, UBOs, etc.). Since data is retrieved from multiple registries, the same entity may appear with slightly different names or details. This ID allows you to identify that "John Smith" as a legal representative is the same person as "J. Smith" listed as a shareholder.
          example: person_001
        control:
          description: Details of control held by the beneficial owner
          example:
            controlType: ownership-of-shares
            description: The person holds more than 50% of the shares in the company.
            percentageDetails:
            - type: shares
              range:
                lower: 50
                upper: 75
            additionalDetails: Direct ownership of shares
          allOf:
          - $ref: '#/components/schemas/ControlDTO'
      required:
      - control
    DataSourcesDTO:
      type: object
      properties:
        company:
          type: object
          description: Per-field data sources for company profile fields. Keys are field names, values describe the source.
        shareholders:
          description: Sources for the shareholders list. Carries list-level overall (e.g. AI reconstruction summary), limitations the agent flagged, and per-entity sources 1:1 by index with the shareholders array.
          allOf:
          - $ref: '#/components/schemas/EntityListSourcesDTO'
        ultimateBeneficialOwners:
          description: Sources for the ultimate beneficial owners list. Same shape as shareholders.
          allOf:
          - $ref: '#/components/schemas/EntityListSourcesDTO'
        legalRepresentatives:
          description: Sources for the legal representatives list. Same shape as shareholders.
          allOf:
          - $ref: '#/components/schemas/EntityListSourcesDTO'
        establishments:
          description: Sources for the establishments list. Same shape as shareholders.
          allOf:
          - $ref: '#/components/schemas/EntityListSourcesDTO'
        otherKeyPersons:
          description: Sources for the other key persons list. Same shape as shareholders.
          allOf:
          - $ref: '#/components/schemas/EntityListSourcesDTO'
        graph:
          description: Sources specific to the ownership graph (per-graph-node provenance). Each company node in the graph that had its shareholders AI-reconstructed carries its own EntityListSourcesDTO under nodes[<nodeId>].shareholders. Distinct from dataSources.shareholders, which is scoped to the result-level shareholders list (the root company only).
          allOf:
          - $ref: '#/components/schemas/GraphSourcesDTO'
    EntityListSourcesDTO:
      type: object
      properties:
        overall:
          description: List-level source. Describes how the entire list was assembled (e.g. AI reconstruction summary covering all shareholders). The analysis field carries the prose; documents lists the supporting documents.
          allOf:
          - $ref: '#/components/schemas/DataSourceDTO'
        limitations:
          description: Structured list of gaps the AI agent flagged about building this list (e.g. unparseable documents, missing share-pledge agreements).
          type: array
          items:
            type: string
        items:
          description: Per-entity sources, 1:1 by array index with the corresponding entity array (e.g. shareholders, ultimateBeneficialOwners).
          type: array
          items:
            $ref: '#/components/schemas/EntitySourcesDTO'
    GraphSourcesDTO:
      type: object
      properties:
        nodes:
          type: object
          description: Per-node provenance, keyed by graph nodeId (graph.nodes[i].nodeId). Today only company nodes that had AI-reconstructed shareholders get an entry. Future per-node provenance types (UBO calculation reasoning, edge sources, etc.) become sibling fields inside each GraphNodeSourcesDTO.
    FinancialTrendsDTO:
