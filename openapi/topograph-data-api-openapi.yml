          - US-WY
          - US-GA
          - US-MN
          - US-MO
          - US-NV
          - US-PA
          - US-CT
          - US-UT
          - US-IA
          - US-AZ
          - US-VA
          - US-MS
          - US-CA
          - US-OR
          - US-KY
          - US-NE
          - US-NC
          - US-AR
          - US-WI
          - US-SC
          - TEST
      required:
      - legalName
      - countryCode
    FinancialRatiosDTO:
      type: object
      properties:
        currentRatio:
          type: number
        quickRatio:
          type: number
        debtToEquity:
          type: number
        netProfitMargin:
          type: number
        returnOnEquity:
          type: number
        revenueGrowth:
          type: number
    EstablishmentDTO:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the establishment
          example: EST-001
        name:
          type: string
          description: The name of the establishment
          example: Main Office
        creationDate:
          type: string
          description: The creation date of the establishment
          example: '2020-01-15'
        endDate:
          type: string
          description: The closing date of the establishment (if applicable)
          example: '2023-12-31'
        active:
          type: boolean
          description: Whether the establishment is currently active
          example: true
        address:
          description: The address of the establishment
          allOf:
          - $ref: '#/components/schemas/AddressDTO'
        activities:
          type: object
          description: A dictionary of activity classifications for this establishment. In multi-establishment countries (e.g. France, Belgium) each site can carry its own activity codes, which may differ from the company-level activity.
          example:
            NACE:
            - code: '62.01'
              description: Computer programming activities
            ISIC:
            - code: J620
              description: Computer programming, consultancy and related activities
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/CompanyActivityItemDTO'
      required:
      - name
    DataPointStatusEnriching:
      type: object
      properties:
        cost:
          type: number
          description: The cost in credits for this data point or document
          example: 10
        costMarkup:
          type: number
          description: The percentage markup when final cost is not yet known
          example: 20
        status:
          type: string
          description: The data point has been retrieved and is being enriched with additional details
          enum:
          - enriching
          example: enriching
      required:
      - status
    GraphNodeContinuationDTO:
      type: object
      properties:
        reason:
          type: string
          description: Why the BFS stopped at this node. `budget` = ran out of credits.
          enum:
          - budget
        estimatedCost:
          type: number
          description: 'Estimated cost in credit cents to fetch this company during a continuation. Dedup-aware: already-paid companies show ~0.'
        accumulatedOwnership:
          type: number
          description: Product of edge percentages from the root to this node (0–1). Undefined if any upstream hop lacked a percentage.
        depth:
          type: number
          description: Depth of this node in the graph (root = 0).
      required:
      - reason
      - estimatedCost
      - depth
    RoleDTO:
      type: object
      properties:
        localName:
          type: string
          description: The local role name in the local language
          example: Directeur
        englishTranslation:
          type: string
          description: The role name in English
          example: Director
        iso5009Code:
          type: string
          description: The ISO 5009 role code
          example: GIDXNF
        semaphoreStandard:
          example: Director
          description: The standardized role of the individual.
          deprecated: true
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
        standardized:
          example: Director
          description: The standardized role of the individual.
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
      required:
      - standardized
    EntitySourcesDTO:
      type: object
      properties:
        entityId:
          type: string
          description: Stable entity identifier matching the underlying entity (e.g. ShareholderDTO.entityId, GraphNodeDTO.nodeId for individuals). Lets consumers look up sources by entity rather than relying on positional alignment.
        fields:
          type: object
          description: Per-field data sources, keyed by field name.
        overall:
          description: Holistic source for this entity (e.g. an AI agent narrative explaining how this shareholder was traced). Distinct from per-field sources, which describe each individual datapoint.
          allOf:
          - $ref: '#/components/schemas/DataSourceDTO'
    TaxIdDTO:
      type: object
      properties:
        type:
          type: string
          description: Tax ID type (Stripe-aligned)
          example: eu_vat
        value:
          type: string
          description: Tax ID value WITHOUT country prefix
          example: '27443061841'
        country:
          type: string
          description: ISO2 country code
          example: FR
        verification:
          description: Verification details for the tax ID
          allOf:
          - $ref: '#/components/schemas/TaxIdVerificationDTO'
      required:
      - type
      - value
      - country
    MonetaryAmountDTO:
      type: object
      properties:
        amount:
          type: number
          description: The numeric amount of money.
          example: 1000
        currency:
          type: string
          description: The ISO 4217 currency code (e.g., EUR, USD).
          example: EUR
        formatted:
          type: string
          description: Formatted string representation of the monetary amount in the local format
          example: 1000.00 €
      required:
      - amount
      - currency
      - formatted
    EmployeeCountDTO:
      type: object
      properties:
        exact:
          type: number
          example: 150
          description: The exact number of employees, if known
        min:
          type: number
          example: 100
          description: The minimum number of employees in a range
        max:
          type: number
          example: 200
          description: The maximum number of employees in a range
        lastUpdated:
          type: string
          example: '2024-03-15'
          description: The date when the employee count was last updated
        isEstimate:
          type: boolean
          example: false
          description: Indicates if the employee count is an estimate
    OtherKeyPersonRoleDTO:
      type: object
      properties:
        localName:
          type: string
          description: The local role name in the local language
          example: Commissaire aux comptes
        englishTranslation:
          type: string
          description: The role name in English
          example: Auditor
        semaphoreStandard:
          example: Board Member
          description: The standardized role of the individual.
          deprecated: true
          allOf:
          - $ref: '#/components/schemas/OtherKeyPersonRoleEnum'
        standardized:
          example: Board Member
          description: The standardized role of the individual.
          allOf:
          - $ref: '#/components/schemas/OtherKeyPersonRoleEnum'
      required:
      - standardized
    FinancialStatementDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Document name in the local language of the country where it was issued
        description:
          type: string
          description: Document description in English
        format:
          type: string
        estimatedDeliverySeconds:
          type: number
        url:
          type: string
        pdfUrl:
          type: string
          description: URL to converted PDF version (when original document is XML)
        blobName:
          type: string
        price:
          type: number
          description: Fixed price in cents
        priceMarkup:
          type: number
          description: Price markup percentage
        date:
          type: string
        period:
          $ref: '#/components/schemas/PeriodDTO'
        extractedFinancialData:
          description: Extracted financial data from the document (only available after document is downloaded and parsed)
          allOf:
          - $ref: '#/components/schemas/ExtractedFinancialDataDTO'
      required:
      - id
      - name
      - format
    GraphMetadataDTO:
      type: object
      properties:
        stoppedReason:
          type: string
          description: Reason why graph traversal stopped
          enum:
          - completed
          - budget_exhausted
          - max_depth_reached
          - max_nodes_reached
          - timeout
        amountSpent:
          type: number
          description: Total amount spent in credit cents during traversal
        companiesFetched:
          type: number
          description: Number of companies successfully fetched during traversal
        companiesSkipped:
          type: number
          description: Number of companies skipped (due to budget or limits)
        interactive:
          type: boolean
          description: True when the request was run in interactive mode. The traversal fetched only the entry node (root for an initial request, seed for a continuation) and emitted its direct company shareholders as `budget_truncated` chips for follow-up exploration. Continuation requests inherit this flag from the parent and cannot opt out.
      required:
      - stoppedReason
      - amountSpent
      - companiesFetched
      - companiesSkipped
    PersonNameDTO:
      type: object
      properties:
        title:
          type: string
          description: Title of the person (e.g., Mr., Mrs., Dr.)
        firstName:
          type: string
          description: First name of the person
        middleName:
          type: string
          description: Middle name of the person
        lastName:
          type: string
          description: Last name of the person
        fullName:
          type: string
          description: Full name of the person
        suffix:
          type: string
          description: Suffix of the name (e.g., Jr., Sr., III)
      required:
      - fullName
  securitySchemes:
    x-api-key:
      type: apiKey
      in: header
      name: x-api-key
